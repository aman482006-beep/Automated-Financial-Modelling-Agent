name: User feedback
description: Share feedback from a ModelForge test session
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing ModelForge. Use synthetic demo data only. Do not upload real financial statements, client files, personal information, credentials, account identifiers or material non-public information. For security issues, use the private reporting process in SECURITY.md.
  - type: dropdown
    id: user_type
    attributes:
      label: Which best describes your use?
      options:
        - Student / learner
        - Finance professional / analyst
        - Developer / open-source contributor
        - Educator
        - Other
    validations:
      required: false
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Describe the workflow, using only synthetic data.
      placeholder: "I tried to import the bundled Aster CSV and map the income statement..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the step where the workflow became confusing or failed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / operating system / screen size
      placeholder: "Chrome 157 · Windows 11 · desktop"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included real financial data, client files, personal information or credentials.
          required: true
