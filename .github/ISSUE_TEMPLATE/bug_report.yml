name: Bug report
description: Report a reproducible defect in ModelForge
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Use synthetic data only. Never upload client workbooks, credentials, personal data or material non-public information. For security vulnerabilities, use the private process in SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Git commit, release or deployment date.
      placeholder: "main @ commit SHA"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, screen size and relevant workbook format.
    validations:
      required: false
