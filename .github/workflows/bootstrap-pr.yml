name: Bootstrap pull-request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Generate the initial lockfile without executing package scripts
        id: lockfile
        if: hashFiles('package-lock.json') == ''
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --lockfile-version=3
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Commit the lockfile to the pull-request branch
        if: steps.lockfile.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add reproducible npm dependency lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Dispatch the full CI workflow against the updated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_HEAD_REF}"
