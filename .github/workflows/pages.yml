name: ModelForge CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Browser, financial engine and Excel checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Generate and commit the initial npm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('package-lock.json') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add reproducible npm dependency lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          gh workflow run pages.yml --ref "${GITHUB_HEAD_REF}"

      - name: Require a lockfile
        run: test -s package-lock.json

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate JavaScript source
        run: |
          node --check engine.js
          node --check workbook.js
          node --check app-main.js
          node --check tests/browser.test.cjs
          node --check tests/excel-recalc.test.cjs

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Install LibreOffice Calc for workbook recalculation tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-calc
          libreoffice --version

      - name: Run all unit, workbook, browser and recalculation tests
        run: npm test

      - name: Assemble static site with local vendor libraries and licence notices
        run: |
          mkdir -p _site/vendor _site/sample-data
          cp index.html styles.css engine.js workbook.js app-main.js _site/
          cp sample-data/aster_industries.csv _site/sample-data/aster_industries.csv
          cp LICENSE README.md THIRD_PARTY_NOTICES.md _site/
          cp node_modules/xlsx-js-style/dist/xlsx.bundle.js _site/vendor/xlsx.bundle.js
          cp node_modules/xlsx-js-style/LICENSE _site/vendor/XLSX-JS-STYLE-LICENSE
          cp node_modules/jszip/dist/jszip.min.js _site/vendor/jszip.min.js
          cp node_modules/jszip/LICENSE.markdown _site/vendor/JSZip-LICENSE.markdown

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
