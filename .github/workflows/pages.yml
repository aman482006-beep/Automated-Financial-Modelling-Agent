name: Deploy ModelForge to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application files
        run: |
          test -f index.html
          test -f styles.css
          test -f engine.js
          test -f workbook.js
          test -f app-main.js
          node --check engine.js
          node --check workbook.js
          node --check app-main.js
      - name: Install workbook test dependency
        run: npm install --no-audit --no-fund
      - name: Run financial engine and Excel formula tests
        run: npm test
      - name: Assemble static site with local Excel runtime
        run: |
          mkdir -p _site/vendor _site/sample-data
          cp index.html styles.css engine.js workbook.js app-main.js _site/
          cp node_modules/xlsx-js-style/dist/xlsx.bundle.js _site/vendor/xlsx.bundle.js
          cp sample-data/aster_industries.csv _site/sample-data/aster_industries.csv
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
